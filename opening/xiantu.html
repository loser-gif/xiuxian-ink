$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'开声':'静音';$('#mute').setAttribute('aria-pressed',String(muted));if(muted){gainTo(0);cleanup()}else if(playing&&!document.hidden){initAudio();if(audio)audio.resume().catch(()=>{});sceneAudio=-1}};
function frame(now){raf=0;if(!playing||document.hidden)return;elapsed+=Math.max(0,Math.min((now-last)/1000,.1));t=elapsed-10;last=now;if(elapsed>=DURATION-1e-8)finish('completed');else{if(t>=0)tickAudio();ui();draw();schedule()}}
function visibility(){if(document.hidden){hiddenPaused=playing;cancelFrame();cleanup();if(audio)audio.suspend().catch(()=>{})}else if(hiddenPaused&&playing){hiddenPaused=false;last=performance.now();sceneAudio=-1;if(audio&&!muted)audio.resume().catch(()=>{});schedule()}}
document.addEventListener('visibilitychange',visibility);
function redraw(){if(!destroyed)draw()}
addEventListener('resize',redraw);
function destroy(){if(destroyed)return;destroyed=true;playing=false;cancelFrame();closeAudio();document.removeEventListener('visibilitychange',visibility);removeEventListener('resize',resize);removeEventListener('resize',redraw);removeEventListener('pagehide',destroy);for(const id of ['male','female','start','replay','skip','mute','back'])$('#'+id).onclick=null}
addEventListener('pagehide',destroy);
window.xiantuOpening=Object.freeze({destroy});
Object.defineProperty(window,'demoDebug',{get:()=>Object.freeze({time:Number(elapsed.toFixed(3)),actTime:t,duration:DURATION,gender,runId,playing,started,muted,reducedMotion:reduced,hiddenPaused,scene:t<0?'growth':t<7?1:t<22?2:t<30.6?3:4,shot:t<0?'growth-'+Math.floor((t+10)/2.5):t>=12.2&&t<16.9?'wheel-and-hands':'mountain-road',cartProgress:cartState().release,gateOpen:span(39,41.8),audioState:audio?.state||'not-created',activeSources:voices.size,audioEvents:audioEvents.map(e=>({...e})),endReason,subtitle:$('#subtitle').textContent}),configurable:false});
